<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h2>Painel de Controle</h2>
            <a href="/" class="btn-sair">Sair</a>
        </header>

        <div>
            <h3 id="titulo-form">Cadastrar Novo Usuário</h3>
            <input type="hidden" id="usuario-id">
            <div class="form-group">
                <input type="text" id="nome" placeholder="Nome">
                <input type="email" id="email" placeholder="E-mail">
                <input type="text" id="cpf" placeholder="CPF" maxlength="11">
                <input type="text" id="telefone" placeholder="Telefone" maxlength="11">
                <input type="date" id="data_nascimento">
                <input type="password" id="senha" placeholder="Senha">
            </div>
            <button onclick="salvarUsuario()" id="btn-salvar-texto">Salvar Usuário</button>
        </div>

        <h3>Usuários Cadastrados</h3>

        <div class="busca-group">
            <input type="number" id="busca-id" placeholder="Buscar por ID..." min="1" onkeypress="if(event.key==='Enter') buscarPorId()">
            <button onclick="buscarPorId()">Buscar</button>
            <button onclick="limparBusca()" class="btn-limpar-busca">Mostrar todos</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Nascimento</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-usuarios"></tbody>
        </table>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
